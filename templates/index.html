<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПтичкаСиничка — Магазин</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .cart-link {
            color: #ffffff;
            text-decoration: none;
            background-color: #1e2636;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .categories-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #ffc107;
            color: #121824;
            font-weight: bold;
        }
        .btn-secondary {
            background-color: #1e2636;
            color: #ffffff;
        }
        .btn-secondary:hover {
            background-color: #2a3447;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .product-card {
            background-color: #1e2636;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
            text-decoration: none;
        }
        .product-title:hover {
            color: #ffc107;
        }
        .price-block {
            margin-bottom: 15px;
        }
        .current-price {
            font-size: 18px;
            font-weight: bold;
            color: #ffc107;
        }
        .old-price {
            font-size: 14px;
            color: #8a99ad;
            text-decoration: line-through;
            margin-left: 8px;
        }
        .buy-btn {
            background-color: #ffc107;
            color: #121824;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .buy-btn:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🕊 ПтичкаСиничка</h2>
            <a href="{{ url_for('cart') }}" class="cart-link">🛒 Кошик ({{ cart_count }})</a>
        </div>

        <!-- Кнопки категорий сверху -->
        <div class="categories-nav">
            <a href="{{ url_for('index') }}" class="btn {% if not selected_category %}btn-primary{% else %}btn-secondary{% endif %}">Усі товари</a>
            {% for cat in categories %}
                <a href="{{ url_for('index', category=cat) }}" class="btn {% if selected_category == cat %}btn-primary{% else %}btn-secondary{% endif %}">{{ cat }}</a>
            {% endfor %}
        </div>

        <!-- Сетка товаров -->
        <div class="products-grid">
            {% for product in products %}
                <div class="product-card">
                    <div>
                        <a href="{{ url_for('product_detail', product_id=product.id) }}">
                            <img src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.title }}">
                        </a>
                        <a href="{{ url_for('product_detail', product_id=product.id) }}" class="product-title">{{ product.title }}</a>
                    </div>
                    <div>
                        <div class="price-block">
                            <span class="current-price">{{ product.price }} грн.</span>
                            {% if product.old_price %}
                                <span class="old-price">{{ product.old_price }} грн.</span>
                            {% endif %}
                        </div>
                        <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
                            <button type="submit" class="buy-btn">У кошик</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
