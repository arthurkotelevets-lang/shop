{% extends "base.html" %}

{% block content %}
<div class="product-detail-container" style="display: flex; gap: 40px; margin-top: 30px; background: #1f2937; padding: 30px; border-radius: 12px; border: 1px solid #374151;">
    <div style="flex: 1;">
        <img src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.title }}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px;">
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
        <h2 style="color: white; margin-top: 0; font-size: 28px;">{{ product.title }}</h2>
        <p style="font-size: 22px; color: #facc15; font-weight: bold; margin: 15px 0;">{{ product.price }} грн.</p>
        <p style="color: #cbd5e1; font-size: 16px; line-height: 1.5; margin-bottom: 25px;">{{ product.description }}</p>
        
        <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST">
            <button type="submit" class="btn-primary" style="padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; background: #2563eb; color: white; font-weight: bold;">Додати в кошик 🛒</button>
        </form>
        
        <div style="margin-top: 25px;">
            <a href="{{ url_for('index') }}" style="color: #38bdf8; text-decoration: none; font-size: 14px;">← Повернутися до каталогу</a>
        </div>
    </div>
</div>
{% endblock %}
