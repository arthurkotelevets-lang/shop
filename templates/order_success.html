<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Замовлення прийнято</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            padding: 50px;
        }
        .success-container {
            background: #fff;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e7d32;
            margin-bottom: 20px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #ff4081;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn-home:hover {
            background-color: #e91e63;
        }
    </style>
</head>
<body>

    <div class="success-container">
        <h1>Дякуємо за замовлення! 🎉</h1>
        <p>Ваше замовлення успішно оформлено та надіслано в систему.</p>
        <p><b>Отримувач:</b> {{ full_name }}</p>
        <p><b>Телефон:</b> {{ phone }}</p>
        <p><b>Сума до сплати:</b> {{ total_price }} грн.</p>
        <p>Очікуйте на дзвінок або повідомлення для підтвердження деталей!</p>
        
        <a href="{{ url_for('index') }}" class="btn-home">Повернутися на головну</a>
    </div>

</body>
</html>
